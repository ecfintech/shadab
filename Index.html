<style>
  :root{
    --ink:#14160F;
    --paper:#F6F1E1;
    --paper-dim:#D9D2B8;
    --brass:#C79A44;
    --brass-light:#E4C275;
    --line: rgba(246,241,225,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    max-width:460px;
    width:100%;
    text-align:center;
    background:var(--ink);
    border:1px solid var(--brass);
    border-radius:14px;
    padding:40px 30px 34px;
  }
  .avatar{
    width:120px; height:120px;
    margin:0 auto 22px;
    border-radius:50%;
    border:3px solid var(--brass);
    background:#F6F1E1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
  }
  .avatar svg{width:46px; height:46px;}
  .avatar img{width:100%; height:100%; object-fit:contain;}
  h1{
    font-size:26px;
    font-weight:800;
    line-height:1.25;
    margin-bottom:14px;
  }
  .skill-line{
    font-size:16px;
    font-weight:600;
    color:var(--brass-light);
    margin-bottom:26px;
  }
  .wanna{
    font-size:22px;
    font-weight:800;
    letter-spacing:0.02em;
    margin-bottom:8px;
  }
  .below{
    font-size:14px;
    color:var(--paper-dim);
    margin-bottom:26px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    background:var(--brass);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    padding:16px 20px;
    border-radius:10px;
    text-decoration:none;
    border:1px solid var(--brass);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .btn:hover{background:transparent; color:var(--brass-light);}
  .btn svg{width:20px; height:20px;}
</style>
</head>
<body>

<div class="card">
  <div class="avatar" aria-hidden="true">
    <img src="IMG-20260914-WA0023.jpg" alt="HATS Consulting logo">
  </div>

  <h1>The most premium asset in 2026?</h1>
  <p class="skill-line">🔥 A Refined Skill Set 📈</p>

  <p class="wanna">WANNA LEARN?</p>
  <p class="below">Then click on the below link 👇</p>

  <a href="https://alvo.chat/8kKO" class="btn" id="cta-primary">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.7 10.9c-1.1.44-1.1 1.06-.2 1.34l4.8 1.5 1.85 5.66c.22.6.38.84.8.84.4 0 .58-.18.8-.4l2.1-2.03 4.63 3.42c.85.47 1.46.23 1.68-.79l3.03-14.29c.32-1.27-.47-1.83-1.29-1.45zM8.9 13.3l9.4-5.86c.47-.28.9-.13.55.18l-8 7.23-.32 3.4-1.63-4.95z"/></svg>
    Start Now
  </a>
</div>

<script>
  var leadFired = false;
  function fireLeadOnce(){
    if(!leadFired){
      leadFired = true;
      fbq('track', 'Lead');
    }
  }
  document.getElementById('cta-primary').addEventListener('click', fireLeadOnce);
</script>

</body>
</html>
